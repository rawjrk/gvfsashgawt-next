<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>I DISSOLVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=block" rel="stylesheet">
<style>
  :root { --red:#ff1a12; --fg:#d8d8d8; --dim:#6a6a6a; --line:#2a2a2a; }
html,body { margin:0; height:100%; background:#000; overflow:hidden; color:var(--fg);
            font-family: "VT323", ui-monospace, Menlo, Consolas, monospace; }
canvas { position:fixed; inset:0; width:100vw; height:100vh; touch-action:none; display:block; cursor:crosshair; }

#toggle { position:fixed; top:10px; right:10px; z-index:3; background:#000; color:var(--fg); border:1px solid var(--fg);
          border-radius:0; padding:4px 10px; font:inherit; font-size:20px; letter-spacing:1px; cursor:pointer; }
#toggle.on { background:var(--red); border-color:var(--red); color:#000; }

#panel { position:fixed; top:48px; right:10px; z-index:2; width:min(320px, calc(100vw - 20px)); max-height:calc(100vh - 64px);
         display:flex; flex-direction:column; background:#000; border:1px solid var(--fg); box-sizing:border-box; font-size:18px; }
#panel.hidden { display:none; }
.head { display:flex; justify-content:space-between; padding:4px 8px; border-bottom:1px solid var(--fg); color:var(--dim); font-size:16px; }
.head b { color:var(--red); font-weight:normal; }

.tabs { display:flex; border-bottom:1px solid var(--fg); }
.tab { flex:1; background:#000; color:var(--dim); border:0; border-right:1px solid var(--line); padding:6px 0; font:inherit; font-size:18px; cursor:pointer; text-transform:uppercase; }
.tab:last-child { border-right:0; }
.tab.on { background:var(--fg); color:#000; }

.pane { display:none; padding:6px 10px 10px; overflow:auto; }
.pane.on { display:block; }
.row { margin:10px 0; }
.row label { display:flex; justify-content:space-between; margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
.row label span::before { content:"> "; color:var(--red); }
.row label b { color:var(--red); font-weight:normal; }

input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:18px; background:transparent; margin:0; }
input[type=range]::-webkit-slider-runnable-track { height:2px; background:var(--line); }
input[type=range]::-moz-range-track { height:2px; background:var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:16px; background:var(--red); border:0; border-radius:0; margin-top:-7px; }
input[type=range]::-moz-range-thumb { width:12px; height:16px; background:var(--red); border:0; border-radius:0; }

select, textarea { width:100%; box-sizing:border-box; background:#000; color:var(--fg); border:1px solid var(--line); border-radius:0; font:inherit; font-size:17px; padding:4px 6px; }
textarea { height:150px; line-height:1; resize:vertical; }
select:focus, textarea:focus { outline:none; border-color:var(--red); }

.btns { display:flex; gap:0; border-top:1px solid var(--fg); }
button.b { flex:1; background:#000; color:var(--fg); border:0; border-right:1px solid var(--line); padding:7px 4px; font:inherit; font-size:17px; text-transform:uppercase; cursor:pointer; }
button.b:last-child { border-right:0; }
button.b:active, button.b.on { background:var(--red); color:#000; }
button.wide { width:100%; border:1px solid var(--fg); margin-top:8px; }
.hint { color:var(--dim); font-size:16px; line-height:1.1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="toggle">[ SYS ]</button>
<div id="panel" class="hidden">
  <div class="head"><span>STATIC OS // CONTROL</span><b id="clock">●</b></div>
  <div class="tabs">
    <button class="tab on" data-t="block">Блок</button>
    <button class="tab" data-t="flow">Течение</button>
    <button class="tab" data-t="trail">След</button>
    <button class="tab" data-t="text">Текст</button>
  </div>
  <div class="pane on" id="p_block">
    <div class="row"><label><span>Размер</span><b id="v_size"></b></label><input id="size" type="range" min="2" max="40" step="1" value="7"></div>
    <div class="row"><label><span>Дыры</span><b id="v_holes"></b></label><input id="holes" type="range" min="0" max="0.6" step="0.01" value="0.15"></div>
    <div class="hint">Тяни в любом месте экрана. Стрелки / WASD, Shift — быстрее.</div>
  </div>
  <div class="pane" id="p_flow">
    <div class="row"><label><span>Стекание</span><b id="v_drip"></b></label><input id="drip" type="range" min="0" max="0.15" step="0.005" value="0.05"></div>
    <div class="row"><label><span>Пауза до сборки, с</span><b id="v_idle"></b></label><input id="idle" type="range" min="0" max="6" step="0.1" value="1.2"></div>
    <div class="row"><label><span>Скорость сборки</span><b id="v_recover"></b></label><input id="recover" type="range" min="0.002" max="0.08" step="0.001" value="0.02"></div>
  </div>
  <div class="pane" id="p_trail">
    <div class="row"><label><span>Красный след</span><b id="v_trail"></b></label><input id="trail" type="range" min="0" max="1" step="0.01" value="0.3"></div>
    <div class="row"><label><span>Глитч / зеркало</span><b id="v_glitch"></b></label><input id="glitch" type="range" min="0" max="1" step="0.01" value="0.35"></div>
    <div class="row"><label><span>Зеркало в покое, частота</span><b id="v_mfreq"></b></label><input id="mfreq" type="range" min="0" max="15" step="0.5" value="5"></div>
    <div class="row"><label><span>Сколько держится, с</span><b id="v_mhold"></b></label><input id="mhold" type="range" min="0.3" max="8" step="0.1" value="3"></div>
  </div>
  <div class="pane" id="p_text">
    <div class="row"><label><span>Размер шрифта</span><b id="v_font"></b></label><input id="font" type="range" min="6" max="32" step="1" value="13"></div>
    <div class="row"><label><span>Текст</span></label><textarea id="text" spellcheck="false"></textarea></div>
    <div class="hint">Пустая строка — отступ. Строка --- делит на левую и правую колонку. {фраза} — всегда зеркально.</div>
    <button class="b wide" id="apply">Применить текст</button>
  </div>
  <div class="btns">
    <button class="b" id="reset">Сброс</button>
    <button class="b" id="freeze">Пауза</button>
    <button class="b" id="hideblock">Блок: вкл</button>
  </div>
</div>

<script>
"use strict";
// ===== config.js =====
const __config = (() => {
// Static configuration: colours, default text, list of tunable parameters.

const COLORS = {
  accent: '#ff1a12',     // red block / trail
  text: '#d8d8d8',       // normal glyphs
  onAccent: '#140000',   // glyphs drawn on top of red cells
  background: '#000',
};

// IDs of <input type="range"> controls. Each one maps 1:1 to a field in `params`
// (see params.js) and has a matching <b id="v_<key>"> label showing its value.
const RANGE_KEYS = [
  'size', 'holes',                 // block
  'drip', 'idle', 'recover',       // flow
  'trail', 'glitch', 'mfreq', 'mhold', // trail & glitch
  'font',                          // text
];

// Letters drawn on red cells are random, often repeating: "BBBBB", "ABCCC", "AWAA".
const RED_LETTERS = {
  alphabet: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  repeat: 0.6,          // chance the next red cell repeats the previous letter
  flickerMs: 160,       // base flicker period; each cell uses 1×–4× of it with its own phase
};

// One hidden phrase shown once, in the red trail, at a random spot.
const RED_PHRASE = {
  text: 'YOU DESTROYED EVERYTHING',
  moveMs: 2500,         // the phrase jumps to a new spot this often
};

// OS version counter (version.js): +1 every time the text fully reassembles,
// at MAX_VERSION the explosion is armed: it goes off when the block touches a symbol.
const VERSION = {
  max: 10,
  settledBelow: 0.35,    // max displacement (cells) that counts as "reassembled"
  touchShare: 0.7,       // share of symbols that must have been moved for a bump
};

// Explosion + reboot (debris.js).
const DEBRIS = {
  blast: 40,             // cells/s initial outward speed
  lift: 25,              // extra random upward kick, cells/s
  gravity: 90,           // cells/s²
  maxFlyMs: 2500,        // safety: everything lands by then
  restMs: 2000,          // how long the pile lies on the floor
  eraseMs: 2200,         // red wave crossing the screen
  eraseJitterMs: 200,
  flashMs: 650,          // how long a symbol stays red (showing the erase phrase) before it vanishes
  erasePhrase: "YOU'RE DESTROYING EVERYTHING. WHY!!!!?? ",
  bootLineMs: 260,       // one boot-log line
  bootHoldMs: 700,       // pause after the last boot line
  revealMs: 900,         // text grid appears row by row
};

// Screen fit: the text sits in a centred box, font scales up on big screens.
const LAYOUT = {
  maxContentCols: 72,   // width of the two-column text box, in cells
  contentShare: 0.9,    // on narrow screens the box takes this share of the width
  baseHeight: 760,      // viewport height (CSS px) at which the font slider is 1:1
};

// Tuned values that are no longer exposed in the panel.
const FIXED_PARAMS = {
  strength: 1.2,   // how much block motion is transferred to the text
  reach: 6,        // radius of influence around the block, cells
  diffuse: 0.18,   // neighbour blending of displacement per frame
  run: 0.9,        // how far wetness spreads down the column
  decay: 0.012,    // red trail fade per frame
  lh: 0.9,         // line height multiplier
  mirr: 0.18,      // share of lines mirrored in the layout
  fontFamily: 'VT323',
};


// Text format:
//   - line breaks are kept, an empty line = paragraph gap
//   - a line with only "---" splits text into the left / right column
//   - {phrase} is always drawn mirrored
//   - %VERSION% is replaced by the live OS version (see version.js)
const DEFAULT_TEXT = `NO SIGNAL.
NO SOURCE.
ONLY NOISE.
ONLY SPACE.

EVERY WORD —
FORGOTTEN.
DRAG IT.
BREAK IT.
WATCH.
NO WORDS — NO WORLD.
WE ARE WHAT
IS LEFT
WHEN THE
MESSAGE FAILS.
READ ME
BEFORE
I DISSOLVE.
---
[void@nosignal ~]$ neofetch

void@nosignal
-------------
OS: Static OS %VERSION%
Host: NULL STATION
Kernel: 6.66-noise

Uptime: lost
Packages: 0 (none)
Shell: echo 1.0

Resolution: 0x0
Terminal: /dev/null
CPU: Signal Loss (1)
GPU: Noise Engine
Memory: 0MiB / ∞

[void@nosignal ~]$ ping source
PING source: no route
timeout
timeout
timeout
--- source unreachable ---

[void@nosignal ~]$ ls /dev/words
ls: cannot access:
every word forgotten

[void@nosignal ~]$ dmesg | tail
[0.001] signal lost
[0.013] glyph cache corrupt
[0.042] text: dissolving
[0.066] mirror: enabled
[0.099] space: only

[void@nosignal ~]$ whoami
what is left

[void@nosignal ~]$ echo $WORLD

[void@nosignal ~]$ sudo rebuild
rebuilding Static OS
[#######---]
Static OS %VERSION% ready

[void@nosignal ~]$ _`;

return { COLORS, RANGE_KEYS, RED_LETTERS, RED_PHRASE, VERSION, DEBRIS, LAYOUT, FIXED_PARAMS, DEFAULT_TEXT };
})();

// ===== state.js =====
const __state = (() => {
// Shared mutable state. Every module imports this one object instead of keeping
// its own copies, so a rebuild (resize, font change) is visible everywhere.
//
// Grid model: the screen is a cols × rows grid of character cells.
// Per-cell data lives in flat typed arrays indexed by i = y * cols + x.

const state = {
  // canvas
  canvas: null,
  ctx: null,
  dpr: 1,

  // grid geometry (device pixels)
  cols: 0, rows: 0, N: 0,
  cellW: 0, cellH: 0,

  // source text, laid out once per build (see textLayout.js)
  text: [],          // char per cell, ' ' = empty
  mirror: null,      // Uint8Array, 1 = glyph is mirrored in the source layout

  // simulation fields (see simulation.js)
  dx: null, dy: null,   // Float32Array displacement field, in cells
  tmpX: null, tmpY: null, // scratch buffers for the diffusion pass
  heat: null,         // Float32Array 0..1, red trail intensity
  fadeRate: null,     // Float32Array per cell, multiplier of the trail fade speed (cells go out one by one)
  wet: null,          // Float32Array 0..1, "wetness" that makes text drip down
  colSpeed: null,     // Float32Array per column, random drip speed factor
  glitchFlip: null,   // Uint8Array, random per-screen-cell mirror (glitch)
  holes: null,        // Uint8Array, black notches inside the red block

  // the red square, top-left corner in cells (float)
  block: { x: 0, y: 0 },
  velocity: { x: 0, y: 0 },   // movement accumulated since last sim step
  lastMove: 0,                // performance.now() of last block movement

  // OS version shown in the text (version.js)
  version: 1,
  disturbed: false,     // text was moved since the last version bump
  touched: null,        // Uint8Array, 1 = this symbol cell was visibly moved since last check
  touchedCount: 0,
  letterCount: 0,       // non-space cells in the layout
  maxDisplacement: 0,   // largest |dx|+|dy| this frame, set by simulation.js

  // finger / mouse button is down on the canvas: effect is held, nothing gathers or fades
  holding: false,

  // flags
  paused: false,
  showBlock: true,
};

/** Block width in cells: cells are taller than wide, so this keeps it square on screen. */
function blockW(params) {
  return Math.max(1, Math.round(params.size * state.cellH / state.cellW));
}

/** Seconds since the block last moved. */
function idleSeconds() {
  if (state.holding) return 0;   // holding the block still is not idle
  return (performance.now() - state.lastMove) / 1000;
}

return { state, blockW, idleSeconds };
})();

// ===== params.js =====
const __params = (() => {
// Reads control-panel values into a plain `params` object used by all modules.

const { RANGE_KEYS, COLORS, FIXED_PARAMS } = __config;
const $ = (id) => document.getElementById(id);

const params = {
  color: COLORS.accent,
  ...FIXED_PARAMS,
  // + every key from RANGE_KEYS as a number
};

function readParams() {
  for (const key of RANGE_KEYS) {
    params[key] = parseFloat($(key).value);
    $('v_' + key).textContent = params[key];
  }
}

return { params, readParams };
})();

// ===== textLayout.js =====
const __textLayout = (() => {
// Lays the source text out on the grid: two ragged columns, repeated to fill
// the screen. Writes state.text and state.mirror.

const { state } = __state;
const { params } = __params;
const { DEFAULT_TEXT, LAYOUT } = __config;
// Deterministic RNG so the layout is the same after every rebuild.
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/** Returns [leftColumnText, rightColumnText]. "---" on its own line splits them. */
function splitColumns(raw) {
  const t = raw.trim() || DEFAULT_TEXT;
  const parts = t.split(/^\s*---\s*$/m);
  return parts.length > 1 ? [parts[0], parts.slice(1).join('\n')] : [t, t];
}

/** Word-wraps each source line to maxW chars; empty lines are kept as ''. */
function wrapLines(src, maxW) {
  const out = [];
  for (const raw of src.split('\n')) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { out.push(''); continue; }
    let cur = '';
    for (const w of line.trim().split(/\s+/)) {
      if (!cur) cur = w.slice(0, maxW);
      else if ((cur + ' ' + w).length <= maxW) cur += ' ' + w;
      else { out.push(cur); cur = w.slice(0, maxW); }
    }
    out.push(cur);
  }
  return out;
}

/**
 * Strips {…} markers and returns per-char mirror flags. Each glyph is mirrored
 * in place; word order stays normal. `open` carries an unclosed "{" over to
 * the next line; `auto` mirrors the whole line (random pick).
 */
function parseMirror(line, open, auto) {
  const chars = [], mirror = [];
  for (const c of line) {
    if (c === '{' || c === '}') { open = c === '{'; continue; }
    chars.push(c);
    mirror.push(open || auto ? 1 : 0);
  }
  return { chars, mirror, open };
}

function layoutText(rawText) {
  const { cols, rows, N } = state;
  state.text = new Array(N).fill(' ');
  state.mirror = new Uint8Array(N);
  seed = 7;

  const [srcL, srcR] = splitColumns(rawText).map((t) => t.replaceAll('%VERSION%', `0.0.${state.version}`));
  // centred text box: on wide screens it stays maxContentCols wide
  const boxW = Math.min(LAYOUT.maxContentCols, Math.floor(cols * LAYOUT.contentShare));
  const left = Math.floor((cols - boxW) / 2), right = left + boxW, mid = left + Math.floor(boxW / 2);
  const top = Math.floor(rows * 0.1), bottom = Math.floor(rows * 0.92);

  const columns = [
    { x0: left, x1: mid - 2, src: srcL, raggedIndent: true },   // manifesto
    { x0: mid + 1, x1: right, src: srcR, raggedIndent: false }, // terminal output, aligned
  ];

  for (const { x0, x1, src, raggedIndent } of columns) {
    const lines = wrapLines(src, Math.max(4, x1 - x0 - 2));
    if (!lines.some(Boolean)) continue;

    let open = false;
    let y = top + Math.floor(rnd() * 3);
    let li = 0;
    let indent = raggedIndent ? Math.floor(rnd() * 3) : 0;

    while (y < bottom) {
      const line = lines[li % lines.length]; li++;
      if (!line) {                                  // paragraph gap
        y += 1 + Math.floor(rnd() * 2);
        if (raggedIndent) indent = Math.floor(rnd() * 4);
        continue;
      }
      // random lines get mirrored glyphs — a different set on every repeat
      const seg = parseMirror(line, open, rnd() < params.mirr);
      open = seg.open;
      for (let k = 0; k < seg.chars.length; k++) {
        const x = x0 + indent + k;
        if (x < x1 && x < cols) {
          state.text[y * cols + x] = seg.chars[k];
          state.mirror[y * cols + x] = seg.mirror[k];
        }
      }
      y++;
      if (li % lines.length === 0) { y += 2; open = false; }  // gap before text repeats
    }
  }
  state.letterCount = state.text.reduce((n, c) => n + (c !== ' '), 0);
}

return { layoutText };
})();

// ===== grid.js =====
const __grid = (() => {
// Canvas sizing, font metrics and (re)allocation of all per-cell buffers.

const { state, blockW } = __state;
const { params } = __params;
const { layoutText } = __textLayout;
const { LAYOUT } = __config;
function fontCss(px) {
  const family = params.fontFamily === 'ui-monospace' ? '' : `"${params.fontFamily}", `;
  return `${px}px ${family}ui-monospace, Menlo, Consolas, monospace`;
}

/** Resolves when the selected web font is ready (or immediately for system fonts). */
function loadFont() {
  if (params.fontFamily === 'ui-monospace' || !document.fonts) return Promise.resolve();
  return document.fonts.load(`20px "${params.fontFamily}"`).catch(() => {});
}

/** Re-rolls a single random cell inside the block, so holes change gradually. */
function driftHole() {
  const w = blockW(params), h = params.size;
  const x = Math.round(state.block.x) + Math.floor(Math.random() * w);
  const y = Math.round(state.block.y) + Math.floor(Math.random() * h);
  if (x < 0 || y < 0 || x >= state.cols || y >= state.rows) return;
  state.holes[y * state.cols + x] = Math.random() < params.holes ? 1 : 0;
}

function reshuffleHoles() {
  for (let i = 0; i < state.N; i++) state.holes[i] = Math.random() < params.holes ? 1 : 0;
}

/** Full rebuild: canvas size → cell size → grid → buffers → text layout. */
function buildGrid(rawText, { keepBlock = false } = {}) {
  const { canvas, ctx } = state;
  // block position as a share of the screen, so a resize doesn't make it jump
  const fx = state.cols ? (state.block.x + blockW(params) / 2) / state.cols : 0.5;
  const fy = state.rows ? (state.block.y + params.size / 2) / state.rows : 0.35;
  state.dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * state.dpr;
  canvas.height = innerHeight * state.dpr;

  // the font slider is tuned for a phone; on taller screens scale it up
  const screenScale = Math.max(1, innerHeight / LAYOUT.baseHeight);
  const fontPx = params.font * screenScale * state.dpr;
  ctx.font = fontCss(fontPx);
  state.cellW = Math.max(1, Math.round(ctx.measureText('M').width));
  state.cellH = Math.max(1, Math.round(fontPx * params.lh));
  state.cols = Math.ceil(canvas.width / state.cellW);
  state.rows = Math.ceil(canvas.height / state.cellH);
  state.N = state.cols * state.rows;

  const N = state.N;
  state.dx = new Float32Array(N);   state.dy = new Float32Array(N);
  state.tmpX = new Float32Array(N); state.tmpY = new Float32Array(N);
  state.heat = new Float32Array(N);
  state.fadeRate = new Float32Array(N).map(() => 1 + Math.random() * 1.5);   // slowest = original speed: same end time, cells go out one by one before it
  state.wet = new Float32Array(N);
  state.glitchFlip = new Uint8Array(N);
  state.holes = new Uint8Array(N);
  state.touched = new Uint8Array(N); state.touchedCount = 0;
  state.colSpeed = new Float32Array(state.cols).map(() => 0.4 + Math.random() * 1.2);

  layoutText(rawText);

  state.block.x = state.cols * (keepBlock ? fx : 0.5) - blockW(params) / 2;
  state.block.y = state.rows * (keepBlock ? fy : 0.35) - params.size / 2;
  reshuffleHoles();
}

/** Clears all distortion and lets the text snap back. */
function resetFields() {
  state.dx.fill(0); state.dy.fill(0);
  state.heat.fill(0); state.wet.fill(0); state.glitchFlip.fill(0);
}

return { fontCss, loadFont, driftHole, reshuffleHoles, buildGrid, resetFields };
})();

// ===== simulation.js =====
const __simulation = (() => {
// The physics of the effect, run once per frame.
//
// Rendering samples text BACKWARDS through a displacement field:
//   screen cell (x, y) shows source cell (x - dx, y - dy).
// So pushing dx/dy in the direction of motion drags the text along.
//
// Per frame:
//   1. inject()  — the moving block adds displacement, heat and wetness around itself
//   2. drip      — wet cells keep increasing dy (text runs down); wetness creeps downward
//   3. diffuse   — dx/dy are blurred with neighbours (smear spreads) and decay (recovery)
//   4. trail     — heat fades; strongly displaced cells randomly glitch-mirror
//
// "Idle" = block hasn't moved for params.idle seconds. While active, recovery
// is nearly off so text keeps running; when idle, drip stops and text gathers back.

const { state, blockW, idleSeconds } = __state;
const { params } = __params;
const { driftHole } = __grid;
/** Moves the block by (mx, my) cells, clamped to the screen, and records velocity. */
function moveBlock(mx, my) {
  const { block, velocity } = state;
  const ox = block.x, oy = block.y;
  block.x = Math.max(-blockW(params) + 1, Math.min(state.cols - 1, block.x + mx));

  const bx0 = block.x, by0 = block.y;
  const bx1 = block.x + blockW(params), by1 = block.y + params.size;
  const x0 = Math.max(0, Math.floor(bx0 - R)), x1 = Math.min(cols - 1, Math.ceil(bx1 + R));

// ===== mirrorAnim.js =====
const __mirrorAnim = (() => {
// Idle letter flips: while nobody touches the screen, in random words
// 1–2 letters snap to mirrored, hold for a while, then snap back.
// Works on SOURCE cells, so a flipped letter stays flipped while it is smeared.

const { state, idleSeconds } = __state;

let active = null;       // Uint8Array per source cell, 1 = currently flipped

function isFlipped(i) {
  return active ? active[i] : 0;
}

  if (!active || active.length !== state.N) active = new Uint8Array(state.N);
  active.fill(0);
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;

  if (idleSeconds() > params.idle && !state.paused && Math.random() < params.mfreq * dt) {
    spawnFlip(now);
  }
  flips = flips.filter((f) => {
    if (now < f.t0) return true;
    if (now > f.t1) return false;
    active[f.i] = 1;
    return true;
  });

/** Start screen: pre-fill so some words already have a flipped letter. */

  const count = Math.round(params.mfreq * params.mhold);
  for (let k = 0; k < count; k++) spawnFlip(now - Math.random() * params.mhold * 1000);
}

function spawnFlip(now) {
  const { N, cols, text } = state;
  for (let tries = 0; tries < 30; tries++) {
    const i = Math.floor(Math.random() * N);
    if (!isLetter(text[i])) continue;

    // word boundaries on this row
    const rowStart = i - (i % cols);
    let a = i, b = i;
    while (a > rowStart && text[a - 1] !== ' ') a--;
    while (b < rowStart + cols - 1 && text[b + 1] !== ' ') b++;

    const letters = [];
    for (let j = a; j <= b; j++) if (isLetter(text[j]) && !flips.some((f) => f.i === j)) letters.push(j);
    if (!letters.length) continue;

    const count = Math.min(letters.length, Math.random() < 0.6 ? 1 : 2);
    for (let k = 0; k < count; k++) {
      const j = letters.splice(Math.floor(Math.random() * letters.length), 1)[0];
      const t0 = now + k * (150 + Math.random() * 600);       // second letter a bit later
      flips.push({ i: j, t0, t1: t0 + params.mhold * 1000 * (0.6 + Math.random() * 0.8) });
    }

  }

// ===== debris.js =====
const __debris = (() => {
// Explosion + reboot sequence at VERSION.max. Phases:
//   fly    — every symbol is blown away from the screen centre, gravity pulls it down
//   rest   — symbols lie in a pile on the floor
//   erase  — a red wave sweeps the pile left→right; each symbol flashes red showing a
//            letter of DEBRIS.erasePhrase (the pile spells it row by row), then vanishes
//   boot   — black screen, Static OS boot log is typed line by line
//   reveal — the text grid reappears row by row from the top (version is 0.0.1 now)
// While any phase runs the simulation is paused (see main.js).

const { state } = __state;
const { DEBRIS, LAYOUT } = __config;
const BOOT_LINES = [
  'STATIC OS BIOS v0.0.1',
  '',
  'memory check ........ ok',
  'glyph cache ......... rebuilt',
  'mounting /dev/words . ok',
  'signal .............. none',
  'source .............. none',
  '',
  'booting Static OS 0.0.1',
];

let phase = 'off';
let phaseStart = 0;
let lastT = 0;

/** Particle / boot-screen drawing instead of the grid. */

      vy: (ey / d) * force / aspect - DEBRIS.lift * Math.random(),

    const r = col < cols - 1 ? heights[col + 1] : Infinity;

    if (l < r || (l === r && Math.random() < 0.5)) col--; else col++;

  const { cols, rows, heights } = state;
  let flying = 0;
  for (const p of particles) {
    if (p.landed) continue;
    p.vy += DEBRIS.gravity * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.x < 0) { p.x = 0; p.vx = -p.vx * 0.4; }
    if (p.x > cols - 1) { p.x = cols - 1; p.vx = -p.vx * 0.4; }
    let col = Math.round(p.x);
    if (p.vy > 0 && p.y >= rows - 1 - heights[col]) {
      col = settleColumn(col, heights, cols);
      p.landed = true;
      p.restX = col;
      p.restY = Math.max(0, rows - 1 - heights[col]);
      heights[col]++;

    for (const p of particles) if (!p.landed) { p.landed = true; p.restX = Math.round(p.x); p.restY = Math.round(p.y); }

    for (const p of particles) {

    }
    setPhase('erase', now);
  }
  else if (phase === 'erase' && t > DEBRIS.eraseMs + DEBRIS.eraseJitterMs + DEBRIS.flashMs) {
    particles = [];
    setPhase('boot', now);
  }
  else if (phase === 'boot' && t > BOOT_LINES.length * DEBRIS.bootLineMs + DEBRIS.bootHoldMs) {
    if (onReboot) onReboot();               // version → 0.0.1, text re-laid out
    setPhase('reveal', now);
  }
  else if (phase === 'reveal' && t > DEBRIS.revealMs) setPhase('off', now);
}

/**
 * Draws the particle / boot screen through the given callback:
 * draw(char, xCells, yCells, style, mirrored) where style is 'text' | 'red'.
 */
function drawDebris(now, draw) {
  if (phase === 'boot') { drawBoot(now, draw); return; }

  for (const p of particles) {
    let x = p.restX, y = p.restY, style = 'text';
    if (phase === 'fly') {
      if (!p.landed) { x = p.x; y = p.y; }
      if (p.red && now - phaseStart < 500) style = 'red';
    } else if (phase === 'erase') {
      const e = now - p.eraseAt;
      if (e > DEBRIS.flashMs) continue;          // erased
      if (e >= 0) {                               // the red wave is passing: show the phrase
        draw(p.eraseChar, x, y, 'red', 0);

function drawBoot(now, draw) {
  const boxW = Math.min(LAYOUT.maxContentCols, Math.floor(state.cols * LAYOUT.contentShare));
  const x0 = Math.floor((state.cols - boxW) / 2);
  const y0 = Math.floor(state.rows * 0.1);

})();

  const x0 = Math.max(0, Math.round(block.x)), x1 = Math.min(cols, Math.round(block.x) + blockW(params));
  const y0 = Math.max(0, Math.round(block.y)), y1 = Math.min(rows, Math.round(block.y) + params.size);
  for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (text[y * cols + x] !== ' ') return true;
  return false;
}

/** Call once per frame after the simulation step. `moved` = block moved this frame. */
function updateVersion(now, getText, moved) {
  if (debrisActive()) return;

  if (armed) {
    if (moved && blockTouchesSymbol()) {
      armed = false;
      resetFields();
      startDebris(now, () => {                 // when the boot log ends
        resetFields();
        state.version = 1;
        state.disturbed = false;
        state.touched.fill(0); state.touchedCount = 0;
        layoutText(getText());
      });
    }
    return;
  }

  const settled = state.disturbed && state.maxDisplacement < VERSION.settledBelow;
  if (!settled) return;

  state.disturbed = false;
  const share = state.letterCount ? state.touchedCount / state.letterCount : 0;
  state.touched.fill(0); state.touchedCount = 0;
  if (share < VERSION.touchShare) return;   // small accidental touches don't count

  state.version += 1;
  layoutText(getText());
  if (state.version >= VERSION.max) armed = true;
}

return { resetVersion, updateVersion };
})();

// ===== input.js =====
const __input = (() => {
// Pointer (mouse / touch) and keyboard control of the block.
// Drag is RELATIVE: the block follows finger movement, not finger position,
// so the finger never covers it.

const { state } = __state;
const { moveBlock } = __simulation;
const held = new Set();
let shift = false;
let drag = null;
const EDGE_PX = 24;   // dead zone at the left/right/bottom edges for touch

function initInput({ onTogglePause, onTogglePanel }) {
  const cv = state.canvas;

  cv.addEventListener('pointerdown', (e) => {
    // touches that start at the screen edge are usually system swipes (back / home)
    const edge = e.pointerType === 'touch' ? EDGE_PX : 0;
    if (e.clientX < edge || e.clientX > innerWidth - edge || e.clientY > innerHeight - edge) return;
    cv.setPointerCapture(e.pointerId);
    drag = { x: e.clientX, y: e.clientY };
    state.holding = true;
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    // a single jump this big is a glitch in the event stream, not a real drag
    if (Math.abs(e.clientX - drag.x) > innerWidth * 0.3 || Math.abs(e.clientY - drag.y) > innerHeight * 0.3) {
      drag.x = e.clientX; drag.y = e.clientY; return;
    }
    const mx = (e.clientX - drag.x) * state.dpr / state.cellW;
    const my = (e.clientY - drag.y) * state.dpr / state.cellH;
    drag.x = e.clientX; drag.y = e.clientY;
    moveBlock(mx, my);
  });
  const end = () => {
    drag = null;
    if (state.holding) { state.holding = false; state.lastMove = performance.now(); }  // idle starts on release
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  addEventListener('keydown', (e) => {
    shift = e.shiftKey;
    if (e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    held.add(k);
    if (e.key === ' ') { e.preventDefault(); onTogglePause(); }
    if (k === 'h') onTogglePanel();
  });
  addEventListener('keyup', (e) => {
    shift = e.shiftKey;
    held.delete(e.key.toLowerCase());
  });
}

/** Called every frame: arrows / WASD move the block, Shift = faster. */
function applyKeyboard() {
  const speed = shift ? 1.2 : 0.4;
  let kx = 0, ky = 0;
  if (held.has('arrowleft') || held.has('a')) kx -= speed;
  if (held.has('arrowright') || held.has('d')) kx += speed;
  if (held.has('arrowup') || held.has('w')) ky -= speed;
  if (held.has('arrowdown') || held.has('s')) ky += speed;
  if (kx || ky) moveBlock(kx, ky);
}

return { initInput, applyKeyboard };
})();

// ===== ui.js =====
const __ui = (() => {
// Control panel: open/close, tabs, buttons, and reacting to slider changes.

const { RANGE_KEYS } = __config;
const { state } = __state;
const { readParams } = __params;
const $ = (id) => document.getElementById(id);

function togglePanel() {
  const hidden = $('panel').classList.toggle('hidden');
  $('toggle').classList.toggle('on', !hidden);
}

function togglePause() {
  state.paused = !state.paused;
  $('freeze').classList.toggle('on', state.paused);
}

/**
 * @param {object} actions
 *   rebuild()       — full grid rebuild (font size, line height, text)
 *   reset()         — clear distortion
 */
function initUI(actions) {
  $('toggle').onclick = togglePanel;

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === tab));
      document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.id === 'p_' + tab.dataset.t));
    };
  });

  for (const key of RANGE_KEYS) {
    $(key).addEventListener('input', () => {
      readParams();
      if (key === 'font') actions.rebuild();
    });
  }

  $('apply').onclick = actions.rebuild;
  $('reset').onclick = actions.reset;
  $('freeze').onclick = togglePause;
  $('hideblock').onclick = () => {
    state.showBlock = !state.showBlock;
    $('hideblock').classList.toggle('on', !state.showBlock);
    $('hideblock').textContent = state.showBlock ? 'Блок: вкл' : 'Блок: выкл';
  };

  // blinking status dot in the panel header
  setInterval(() => {
    const dot = $('clock');
    dot.style.visibility = dot.style.visibility === 'hidden' ? 'visible' : 'hidden';
  }, 600);
}

const getText = () => $('text').value;
const setText = (t) => { $('text').value = t; };

return { togglePanel, togglePause, initUI, getText, setText };
})();

// ===== main.js =====
const __main = (() => {
// Entry point: wires modules together and runs the frame loop.

const { DEFAULT_TEXT } = __config;
const { state } = __state;
const { readParams } = __params;
const { buildGrid, loadFont, resetFields } = __grid;
const { stepSimulation } = __simulation;
const { updateFlips, seedFlips } = __mirrorAnim;
const { render } = __renderer;
const { updateVersion } = __version;
const { debrisActive, updateDebris } = __debris;
const { initInput, applyKeyboard } = __input;
const { initUI, togglePanel, togglePause, getText, setText } = __ui;
state.canvas = document.getElementById('c');
state.ctx = state.canvas.getContext('2d');

const rebuild = () => { buildGrid(getText()); seedFlips(); };

initUI({
  rebuild,
  reset: resetFields,
});
initInput({ onTogglePause: togglePause, onTogglePanel: togglePanel });

// Mobile browsers fire 'resize' when their toolbars show/hide (small height change).
// Ignore those; on a real resize keep the block where it was instead of resetting it.
let resizeTimer, lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const widthChanged = innerWidth !== lastW;
    const heightChanged = Math.abs(innerHeight - lastH) / lastH > 0.15;
    if (!widthChanged && !heightChanged) return;
    lastW = innerWidth; lastH = innerHeight;
    buildGrid(getText(), { keepBlock: true });
  }, 150);
});

function frame() {
  const now = performance.now();
  if (!state.paused) {
    applyKeyboard();
    const moved = state.velocity.x !== 0 || state.velocity.y !== 0;   // read before the sim consumes it
    if (debrisActive()) { updateDebris(now); state.velocity.x = state.velocity.y = 0; }
    else stepSimulation();
    updateVersion(now, getText, moved);
  }
  updateFlips(performance.now());
  render();
  requestAnimationFrame(frame);
}

readParams();
setText(DEFAULT_TEXT);
rebuild();
requestAnimationFrame(frame);
loadFont().then(rebuild);   // rebuild once the web font has arrived (metrics change)

return {  };
})();
</script>
</body>
</html>
